<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docintel</title>
<style>
  :root {
    --bg: #15171b;
    --panel: #1c1f24;
    --panel-border: #2b2f36;
    --text: #e7e5e0;
    --muted: #8b9099;
    --accent: #c99a3e;
    --accent-dim: #4a3d21;
    --ok: #6fae86;
    --ok-dim: #223129;
    --err: #c1594a;
    --err-dim: #33221f;
    --wait: #6b7280;
    --wait-dim: #23262b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 18px;
  }
  header .title {
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  header .title span { color: var(--accent); }
  header .subtitle {
    color: var(--muted);
    font-size: 13px;
  }
  .pool {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px var(--ok-dim);
  }
  .dot.off { background: var(--err); box-shadow: 0 0 0 3px var(--err-dim); }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 600;
  }
  #dropzone {
    border: 1.5px dashed var(--panel-border);
    border-radius: 8px;
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #dropzone:hover, #dropzone.drag {
    border-color: var(--accent);
    color: var(--text);
  }
  #dropzone strong { color: var(--text); }
  #fileList {
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
  }
  #fileList div { padding: 2px 0; }
  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .field input {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 14px;
    font-family: var(--sans);
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .actions {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  button.primary {
    background: var(--accent);
    color: #1a1509;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: var(--mono);
  }
  button.ghost:hover { color: var(--err); border-color: var(--err); }
  #formMsg { font-size: 13px; color: var(--muted); }

  /* FASE 2 -- aditivo: estilos do botão/seção de legislação */
  .leg-actions {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .leg-actions input {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: var(--sans);
    flex: 1;
    min-width: 180px;
  }
  button.ghost-accent {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.ghost-accent:disabled { opacity: .45; cursor: default; }
  button.ghost-accent:hover:not(:disabled) { background: var(--accent-dim); }
  #legFormMsg { font-size: 12.5px; color: var(--muted); }

  .progress-wrap {
    margin-top: 16px;
    display: none;
  }
  .progress-wrap.show { display: block; }
  .progress-track {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .15s ease;
  }
  .progress-label {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
    display: flex;
    justify-content: space-between;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    font-weight: 600;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--panel-border);
  }
  tbody td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--panel-border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  .fname { font-family: var(--mono); font-size: 12.5px; }
  .fmeta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid transparent;
  }
  .badge.pendente { color: var(--muted); background: var(--wait-dim); border-color: var(--panel-border); }
  .badge.processando { color: var(--accent); background: var(--accent-dim); }
  .badge.concluido { color: var(--ok); background: var(--ok-dim); border: 1px solid var(--ok); }
  .badge.erro { color: var(--err); background: var(--err-dim); }
  .badge.cancelado { color: var(--muted); background: transparent; border: 1px dashed var(--panel-border); }
  .badge.reaproveitado { color: var(--muted); background: transparent; border: 1px dashed var(--panel-border); margin-left: 6px; }
  .badge .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1); }
  }
  .elapsed { color: var(--muted); font-size: 11px; margin-top: 2px; font-family: var(--mono); }
  .stall-hint { color: var(--muted); font-size: 11px; margin-top: 2px; font-style: italic; }
  a.link { color: var(--accent); text-decoration: none; font-size: 12.5px; }
  a.link:hover { text-decoration: underline; }
  .row-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 20px 4px; }
  .err-msg { color: var(--err); font-size: 11.5px; margin-top: 3px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title">doc<span>intel</span></div>
      <div class="subtitle">conversor local de PDF para Obsidian</div>
    </div>
    <div class="pool"><span class="dot" id="poolDot"></span><span id="poolLabel">--</span></div>
  </header>

  <div class="card">
    <h2>Novo lote</h2>
    <div id="dropzone">
      Arraste PDFs aqui ou <strong>clique para escolher</strong>
      <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
    </div>
    <div id="fileList"></div>

    <div class="fields">
      <div class="field">
        <label for="disciplina">Disciplina</label>
        <input id="disciplina" placeholder="ex: Constitucional">
      </div>
      <div class="field">
        <label for="professora">Professor(a)</label>
        <input id="professora" placeholder="ex: Nathalia Masson">
      </div>
      <div class="field">
        <label for="aula">Aula (nº)</label>
        <input id="aula" placeholder="deixe em branco p/ detectar do nome do arquivo">
      </div>
      <div class="field full">
        <label for="tags">Tags (separadas por vírgula)</label>
        <input id="tags" placeholder="ex: constitucional, processo-legislativo">
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="submitBtn" disabled>Converter</button>
      <span id="formMsg"></span>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label">
        <span id="progressText">Enviando...</span>
        <span id="progressPct">0%</span>
      </div>
    </div>

    <!-- FASE 2 -- aditivo: pós-processamento específico pra legislação,
         reaproveita os mesmos arquivos selecionados acima. -->
    <div class="leg-actions">
      <input id="legTitulo" placeholder="Título da lei/código (opcional)">
      <button class="ghost-accent" id="legSubmitBtn" disabled>Markdown de Legislação</button>
      <span id="legFormMsg"></span>
    </div>
  </div>

  <div class="card">
    <h2>Fila de conversão</h2>
    <table>
      <thead>
        <tr>
          <th>Arquivo</th>
          <th>Status</th>
          <th>Imagens</th>
          <th>Enviado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="jobsBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">Nenhuma conversão ainda.</div>
  </div>

  <!-- FASE 2 -- aditivo: fila própria pro Markdown de Legislação -->
  <div class="card">
    <h2>Fila de legislação</h2>
    <table>
      <thead>
        <tr>
          <th>Arquivo</th>
          <th>Status</th>
          <th>Artigos</th>
          <th>Enviado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="legJobsBody"></tbody>
    </table>
    <div class="empty" id="legEmptyState" style="display:none">Nenhuma legislação processada ainda.</div>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const submitBtn = document.getElementById('submitBtn');
const formMsg = document.getElementById('formMsg');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const progressPct = document.getElementById('progressPct');
let selectedFiles = [];

dropzone.addEventListener('click', () => fileInput.click());
['dragenter', 'dragover'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); })
);
['dragleave', 'drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
);
dropzone.addEventListener('drop', e => setFiles(e.dataTransfer.files));
fileInput.addEventListener('change', e => setFiles(e.target.files));

function setFiles(fileListLike) {
  selectedFiles = Array.from(fileListLike).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  fileListEl.innerHTML = selectedFiles.map(f => `<div>• ${f.name} (${formatBytes(f.size)})</div>`).join('');
  submitBtn.disabled = selectedFiles.length === 0;
}

function formatBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB`;
}

// Upload via XMLHttpRequest (em vez de fetch) porque fetch não expõe
// progresso de envio -- isso é o que alimenta a barra de progresso real.
function uploadWithProgress(files, meta) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    files.forEach(f => form.append('files', f));
    Object.entries(meta).forEach(([k, v]) => form.append(k, v));

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/convert');

    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.max(1, Math.round((e.loaded / e.total) * 100));
      progressBar.style.width = pct + '%';
      progressPct.textContent = pct + '%';
      progressText.textContent = pct < 100
        ? `Enviando ${formatBytes(e.loaded)} / ${formatBytes(e.total)}...`
        : 'Upload concluído, aguardando o servidor...';
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (err) { reject(new Error('resposta inválida do servidor')); }
      } else {
        reject(new Error(`o servidor recusou o upload (HTTP ${xhr.status})`));
      }
    };
    xhr.onerror = () => reject(new Error('falha de rede durante o envio -- confira a conexão com o servidor'));
    xhr.ontimeout = () => reject(new Error('o envio expirou -- tente novamente ou verifique o servidor'));
    xhr.send(form);
  });
}

submitBtn.addEventListener('click', async () => {
  if (selectedFiles.length === 0) return;
  submitBtn.disabled = true;
  formMsg.textContent = '';
  progressWrap.classList.add('show');
  progressBar.style.width = '0%';
  progressPct.textContent = '0%';
  progressText.textContent = 'Enviando...';

  const meta = {
    disciplina: document.getElementById('disciplina').value,
    professora: document.getElementById('professora').value,
    aula: document.getElementById('aula').value,
    tags: document.getElementById('tags').value,
  };

  try {
    await uploadWithProgress(selectedFiles, meta);
    progressBar.style.width = '100%';
    progressPct.textContent = '100%';
    progressText.textContent = 'Enviado com sucesso.';
    formMsg.textContent = 'Acompanhe o progresso da conversão na fila abaixo.';
    selectedFiles = [];
    fileListEl.innerHTML = '';
    fileInput.value = '';
    loadJobs();
  } catch (err) {
    progressText.textContent = 'Falha no envio.';
    formMsg.textContent = err.message || 'Erro ao enviar. Tente novamente.';
  } finally {
    submitBtn.disabled = selectedFiles.length === 0;
    setTimeout(() => progressWrap.classList.remove('show'), 4000);
  }
});

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return `há ${Math.floor(diff / 60)} min`;
  if (diff < 86400) return `há ${Math.floor(diff / 3600)} h`;
  return `há ${Math.floor(diff / 86400)} d`;
}

function elapsedSince(iso) {
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return `${diff}s`;
  const min = Math.floor(diff / 60);
  const sec = diff % 60;
  return `${min}min ${sec}s`;
}

function statusLabel(s) {
  return { pendente: 'pendente', processando: 'processando', concluido: 'concluído', erro: 'erro', cancelado: 'cancelado' }[s] || s;
}

async function cancelJob(jobId) {
  try {
    const res = await fetch(`/api/jobs/${jobId}/cancel`, { method: 'POST' });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(body.erro || 'Não foi possível cancelar este job.');
    }
  } catch (err) {
    alert('Falha ao pedir cancelamento -- confira a conexão com o servidor.');
  }
  loadJobs();
}

// Baixa o .zip (markdown + imagens renomeadas). Em navegadores baseados em
// Chromium, usa a File System Access API pra abrir o diálogo nativo de
// "salvar como"; nos demais, cai no download padrão do navegador.
async function downloadZip(jobId, suggestedName) {
  let blob;
  try {
    const res = await fetch(`/api/jobs/${jobId}/download-zip`);
    if (!res.ok) throw new Error('servidor recusou o pedido');
    blob = await res.blob();
  } catch (err) {
    alert('Falha ao gerar o zip para download.');
    return;
  }

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: 'Arquivo zip', accept: { 'application/zip': ['.zip'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return; // usuário cancelou o diálogo
      // se a File System Access API falhar por outro motivo, cai no fallback abaixo
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function deleteJob(jobId) {
  if (!confirm('Tem certeza que deseja excluir este arquivo? Ele será removido do banco e do disco permanentemente -- essa ação não pode ser desfeita.')) {
    return;
  }
  try {
    const res = await fetch(`/api/jobs/${jobId}`, { method: 'DELETE' });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(body.erro || 'Não foi possível excluir este arquivo.');
    }
  } catch (err) {
    alert('Falha ao excluir -- confira a conexão com o servidor.');
  }
  loadJobs();
}

window.cancelJob = cancelJob;
window.downloadZip = downloadZip;
window.deleteJob = deleteJob;

async function loadJobs() {
  try {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    const body = document.getElementById('jobsBody');
    const empty = document.getElementById('emptyState');

    if (jobs.length === 0) {
      body.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    body.innerHTML = jobs.map(j => {
      const metaParts = [j.disciplina, j.professora].filter(Boolean);
      const metaLine = metaParts.length ? `<div class="fmeta">${metaParts.join(' · ')}</div>` : '';
      const errLine = j.status === 'erro' && j.error_message
        ? `<div class="err-msg">⚠ ${escapeHtml(j.error_message).slice(0, 160)}</div>` : '';
      const reaproveitado = j.reaproveitado ? '<span class="badge reaproveitado">já existia</span>' : '';

      let statusExtra = '';
      let badgeInner = statusLabel(j.status);
      if (j.status === 'processando') {
        badgeInner = `<span class="pulse"></span>${statusLabel(j.status)}`;
        statusExtra = `<div class="elapsed">rodando há ${elapsedSince(j.updated_at)}</div>`;
        const elapsedSec = (Date.now() - new Date(j.updated_at).getTime()) / 1000;
        if (elapsedSec > 120) {
          statusExtra += `<div class="stall-hint">PDFs grandes/escaneados podem demorar -- ainda em andamento</div>`;
        }
      } else if (j.status === 'pendente') {
        statusExtra = `<div class="elapsed">na fila há ${elapsedSince(j.created_at)}</div>`;
      }

      const actions = [];
      if (j.status === 'concluido') {
        const zipName = (j.md_path ? j.md_path.split('/').pop().replace(/\.md$/, '') : j.original_filename.replace(/\.pdf$/i, '')) + '.zip';
        actions.push(`<button class="ghost" style="color:var(--accent);border-color:var(--accent)" onclick="downloadZip('${j.id}', '${escapeHtml(zipName)}')">baixar .zip</button>`);
        actions.push(`<a class="link" href="/api/jobs/${j.id}/download" target="_blank">.md</a>`);
      }
      if (j.status === 'pendente' || j.status === 'processando') {
        actions.push(`<button class="ghost" onclick="cancelJob('${j.id}')">cancelar</button>`);
      }
      actions.push(`<button class="ghost" style="color:#e05252;border-color:#e05252" onclick="deleteJob('${j.id}')">excluir</button>`);

      return `
        <tr>
          <td>
            <div class="fname">${escapeHtml(j.original_filename)}</div>
            ${metaLine}
            ${errLine}
          </td>
          <td>
            <span class="badge ${j.status}">${badgeInner}</span>${reaproveitado}
            ${statusExtra}
          </td>
          <td>${j.status === 'concluido' ? (j.n_images || 0) : '—'}</td>
          <td>${timeAgo(j.created_at)}</td>
          <td><div class="row-actions">${actions.join('')}</div></td>
        </tr>`;
    }).join('');
  } catch (err) {
    // silencioso -- próxima leva de polling tenta de novo
  }
}

async function loadHealth() {
  try {
    const res = await fetch('/api/health');
    const h = await res.json();
    document.getElementById('poolLabel').textContent = `${h.workers} workers · ${h.fila} na fila`;
    document.getElementById('poolDot').classList.remove('off');
  } catch (err) {
    document.getElementById('poolLabel').textContent = 'servidor inacessível';
    document.getElementById('poolDot').classList.add('off');
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---------------------------------------------------------------------
// FASE 2 -- aditivo: fluxo do botão "Markdown de Legislação". Reaproveita
// a MESMA seleção de arquivos (selectedFiles) do fluxo padrão acima, mas
// envia pra um endpoint e uma fila totalmente separados.
// ---------------------------------------------------------------------
const legSubmitBtn = document.getElementById('legSubmitBtn');
const legFormMsg = document.getElementById('legFormMsg');

// escuta os mesmos eventos do dropzone/input já existentes, só pra manter
// o botão de legislação sincronizado com a seleção de arquivos -- não
// substitui nem modifica os listeners originais, só adiciona mais um.
['drop'].forEach(evt => dropzone.addEventListener(evt, () => syncLegButton()));
fileInput.addEventListener('change', () => syncLegButton());
function syncLegButton() {
  legSubmitBtn.disabled = selectedFiles.length === 0;
}

function uploadLegislacaoWithProgress(files, titulo) {
  return new Promise((resolve, reject) => {
    const form = new FormData();
    files.forEach(f => form.append('files', f));
    form.append('titulo', titulo);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/convert-legislacao');
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.max(1, Math.round((e.loaded / e.total) * 100));
      progressWrap.classList.add('show');
      progressBar.style.width = pct + '%';
      progressPct.textContent = pct + '%';
      progressText.textContent = pct < 100
        ? `Enviando ${formatBytes(e.loaded)} / ${formatBytes(e.total)}...`
        : 'Upload concluído, aguardando o servidor...';
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (err) { reject(new Error('resposta inválida do servidor')); }
      } else {
        reject(new Error(`o servidor recusou o upload (HTTP ${xhr.status})`));
      }
    };
    xhr.onerror = () => reject(new Error('falha de rede durante o envio'));
    xhr.send(form);
  });
}

legSubmitBtn.addEventListener('click', async () => {
  if (selectedFiles.length === 0) return;
  legSubmitBtn.disabled = true;
  legFormMsg.textContent = '';

  try {
    await uploadLegislacaoWithProgress(selectedFiles, document.getElementById('legTitulo').value);
    legFormMsg.textContent = 'Enviado. Acompanhe na fila de legislação abaixo.';
    selectedFiles = [];
    fileListEl.innerHTML = '';
    fileInput.value = '';
    submitBtn.disabled = true;
    loadLegislacaoJobs();
  } catch (err) {
    legFormMsg.textContent = err.message || 'Erro ao enviar. Tente novamente.';
  } finally {
    legSubmitBtn.disabled = selectedFiles.length === 0;
    setTimeout(() => progressWrap.classList.remove('show'), 4000);
  }
});

async function cancelLegislacaoJob(jobId) {
  try {
    const res = await fetch(`/api/legislacao-jobs/${jobId}/cancel`, { method: 'POST' });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(body.erro || 'Não foi possível cancelar este job.');
    }
  } catch (err) {
    alert('Falha ao pedir cancelamento -- confira a conexão com o servidor.');
  }
  loadLegislacaoJobs();
}
window.cancelLegislacaoJob = cancelLegislacaoJob;

async function deleteLegislacaoJob(jobId) {
  if (!confirm('Tem certeza que deseja excluir este arquivo? Ele será removido do banco e do disco permanentemente -- essa ação não pode ser desfeita.')) {
    return;
  }
  try {
    const res = await fetch(`/api/legislacao-jobs/${jobId}`, { method: 'DELETE' });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(body.erro || 'Não foi possível excluir este arquivo.');
    }
  } catch (err) {
    alert('Falha ao excluir -- confira a conexão com o servidor.');
  }
  loadLegislacaoJobs();
}
window.deleteLegislacaoJob = deleteLegislacaoJob;

async function loadLegislacaoJobs() {
  try {
    const res = await fetch('/api/legislacao-jobs');
    const jobs = await res.json();
    const body = document.getElementById('legJobsBody');
    const empty = document.getElementById('legEmptyState');

    if (jobs.length === 0) {
      body.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    body.innerHTML = jobs.map(j => {
      const errLine = j.status === 'erro' && j.error_message
        ? `<div class="err-msg">⚠ ${escapeHtml(j.error_message).slice(0, 160)}</div>` : '';
      const reaproveitado = j.reaproveitado ? '<span class="badge reaproveitado">já existia</span>' : '';

      let statusExtra = '';
      let badgeInner = statusLabel(j.status);
      if (j.status === 'processando') {
        badgeInner = `<span class="pulse"></span>${statusLabel(j.status)}`;
        statusExtra = `<div class="elapsed">rodando há ${elapsedSince(j.updated_at)}</div>`;
      } else if (j.status === 'pendente') {
        statusExtra = `<div class="elapsed">na fila há ${elapsedSince(j.created_at)}</div>`;
      }

      const actions = [];
      if (j.status === 'concluido') {
        actions.push(`<a class="link" href="/api/legislacao-jobs/${j.id}/download" target="_blank">baixar .md</a>`);
      }
      if (j.status === 'pendente' || j.status === 'processando') {
        actions.push(`<button class="ghost" onclick="cancelLegislacaoJob('${j.id}')">cancelar</button>`);
      }
      actions.push(`<button class="ghost" style="color:#e05252;border-color:#e05252" onclick="deleteLegislacaoJob('${j.id}')">excluir</button>`);

      return `
        <tr>
          <td>
            <div class="fname">${escapeHtml(j.original_filename)}</div>
            ${j.titulo ? `<div class="fmeta">${escapeHtml(j.titulo)}</div>` : ''}
            ${errLine}
          </td>
          <td>
            <span class="badge ${j.status}">${badgeInner}</span>${reaproveitado}
            ${statusExtra}
          </td>
          <td>${j.status === 'concluido' ? (j.n_artigos || 0) : '—'}</td>
          <td>${timeAgo(j.created_at)}</td>
          <td><div class="row-actions">${actions.join('')}</div></td>
        </tr>`;
    }).join('');
  } catch (err) {
    // silencioso -- próxima leva de polling tenta de novo
  }
}

loadLegislacaoJobs();
setInterval(loadLegislacaoJobs, 3000);

loadJobs();
loadHealth();
setInterval(loadJobs, 3000);
setInterval(loadHealth, 5000);
</script>
